name: Bug report
description: Something isn't working the way the spec / your expectations say it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please **do not** include pairing secrets,
        certificates, or full IP addresses/logs — see `docs/protocol.md` if you want to describe
        wire-level behaviour instead of pasting captures.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pair phone with Mac
        2. Open Touchpad
        3. ...
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Which side?
      options:
        - iOS app
        - Mac helper
        - Both / the wire protocol between them
        - AirMouseKit (airmouse-cli or a Swift package consumer)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model(s)
      placeholder: iPhone 16 Pro, Mac mini (M2)
    validations:
      required: true
  - type: input
    id: os-versions
    attributes:
      label: iOS / macOS versions
      placeholder: iOS 18.6, macOS 15.6
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App / helper version
      placeholder: 0.3.1 (About screen)
    validations:
      required: true
  - type: input
    id: protocol-version
    attributes:
      label: Negotiated protocol version (Diagnostics window, if visible)
      placeholder: "1"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: >
        Paste from the in-app Diagnostics export if possible. Never paste text you typed, pairing
        secrets, or certificate fingerprints in full — the app already truncates these per spec §7.4;
        please don't work around that.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I confirmed this isn't a security vulnerability (if it is, see SECURITY.md instead).
          required: true
